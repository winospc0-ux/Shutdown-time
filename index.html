<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b0a" />
  <title>موعد الدوام | العد التنازلي</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="page-title">
      <div class="topline">
        <span class="status-dot" aria-hidden="true"></span>
        <span>عداد هذا الشهر</span>
      </div>

      <header class="hero">
        <p class="eyebrow">الجامعة / الموعد القادم</p>
        <h1 id="page-title">العد التنازلي للدوام</h1>
        <p class="description">الوقت المتبقي حتى بداية دوام يوم 21 من هذا الشهر.</p>
      </header>

      <div class="date-chip" id="target-date" aria-live="polite">21 — هذا الشهر</div>

      <section class="countdown" aria-label="الوقت المتبقي">
        <div class="time-card">
          <strong class="time" id="days">00</strong>
          <span class="label">يوم</span>
        </div>
        <div class="time-card">
          <strong class="time" id="hours">00</strong>
          <span class="label">ساعة</span>
        </div>
        <div class="time-card">
          <strong class="time" id="minutes">00</strong>
          <span class="label">دقيقة</span>
        </div>
        <div class="time-card">
          <strong class="time" id="seconds">00</strong>
          <span class="label">ثانية</span>
        </div>
        <div class="time-card milliseconds-card">
          <strong class="time" id="milliseconds">000</strong>
          <span class="label">ملي ثانية</span>
        </div>
      </section>

      <div class="progress-track" aria-hidden="true">
        <span id="progress"></span>
      </div>
      <p class="footer-note">يتحدث العداد تلقائياً — لا ينتقل إلى الشهر القادم</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
