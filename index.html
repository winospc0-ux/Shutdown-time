<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عد.تنازلي للدوام في الجامعة</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>العد. التنازلي للدوام</h1>
    <p class="subtitle">في جامعات — اليوم ٢١ من هذا الشهر</p>
    <div class="countdown">
      <div class="time-box">
        <span class="time" id="days">00</span>
        <span class="label">يوم</span>
      </div>
      <div class="time-box">
        <span class="time" id="hours">00</span>
        <span class="label">ساعة</span>
      </div>
      <div class="time-box">
        <span class="time" id="minutes">00</span>
        <span class="label">دقيقة</span>
      </div>
      <div class="time-box">
        <span class="time" id="seconds">00</span>
        <span class="label">ثانية</span>
      </div>
      <div class="time-box milliseconds-box">
        <span class="time" id="milliseconds">000</span>
        <span class="label">ملي ثانية</span>
      </div>
    </div>
    <p class="target-info" id="target-date"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
